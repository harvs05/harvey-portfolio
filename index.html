<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Harvey Varela - WordPress & Canva Virtual Assistant</title>

    <meta
      name="description"
      content="Harvey Varela is a Virtual Assistant specializing in WordPress website support, Canva graphic design, and digital content support."
    />

    <meta name="author" content="Harvey Varela" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta name="theme-color" content="#F4F4ED" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Preload desktop profile avatar -->
    <link
      rel="preload"
      as="image"
      href="/avatar1.jpg"
      fetchpriority="high"
      media="(min-width: 1100px)"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="Harvey Varela"
    />

    <meta
      property="og:title"
      content="Harvey Varela - WordPress & Canva Virtual Assistant"
    />

    <meta
      property="og:description"
      content="Virtual Assistant specializing in WordPress website support, Canva graphic design, and digital content support."
    />

    <!--
      Add the following after your Vercel domain is finalized:

      <meta
        property="og:url"
        content="https://your-domain.vercel.app/"
      />

      <meta
        property="og:image"
        content="https://your-domain.vercel.app/share.png"
      />
    -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!--
      Theme before first paint.
      Default theme: light.
      Dark mode is stored in localStorage.
    -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("theme") === "dark"
              ? "dark"
              : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }

        if (
          document.documentElement.dataset.theme === "dark"
        ) {
          var bar = document.querySelector(
            'meta[name="theme-color"]'
          );

          if (bar) {
            bar.setAttribute("content", "#070B14");
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
